version: 2

models:
  - name: dim_date
    description: "Grain: one row per calendar day."
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: dim_accounts
    description: "Grain: one row per account_id (current state)."
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: company_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_market_universe')
                field: company_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['self_serve', 'inbound_marketing', 'outbound_sdr']
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Churned']
      - name: territory
        description: >
          One of NA-East / NA-West / EMEA / APAC / LATAM -- a deterministic
          sub-division of region. Unlike region/industry (baked into
          accounts.csv directly at generation time), territory is sourced
          via a join to stg_company_territory since it lives in a separate
          lookup table; this is intentional, not an inconsistency.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NA-East', 'NA-West', 'EMEA', 'APAC', 'LATAM']

  - name: dim_reps
    description: >
      Grain: one row per rep_id per capacity-period (quota/status change
      point).
    columns:
      - name: rep_id
        tests: [not_null]
      - name: territory
        description: >
          One of NA-East / NA-West / EMEA / APAC / LATAM. A new-business
          coverage/routing concept scoped to account-owning reps (rep_type
          ISR/AE) -- null for every SE and AM-Commercial/AM-Enterprise rep
          by design, not a data gap. No not_null test here since null is a
          legitimate value; accepted_values is scoped to the non-null rows
          only (see tests/assert_dim_reps_territory_scoped_to_account_owning_reps.sql
          for the null-iff-not-ISR/AE invariant in both directions).
        tests:
          - accepted_values:
              arguments:
                values: ['NA-East', 'NA-West', 'EMEA', 'APAC', 'LATAM']
              config:
                where: "territory is not null"
      - name: segment
        description: >
          Rep's segment focus -- SMB is self-serve/system-owned with no
          human reps, so only Commercial/Enterprise are valid here.
        tests:
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: rep_type
        tests:
          - accepted_values:
              arguments:
                values: ['ISR', 'AE', 'SE', 'AM-Commercial', 'AM-Enterprise']
      - name: rep_status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'departed']
    # Composite-key uniqueness for (rep_id, period_start_date) isn't a
    # single-column generic test -- dbt_utils isn't installed for this
    # project (kept dependency-free per the sources.yml design note), so
    # it's covered instead by the singular test
    # tests/assert_dim_reps_period_uniqueness.sql.

  - name: dim_market_universe
    description: "Grain: one row per company_id (prospect + customer universe)."
    columns:
      - name: company_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
              config:
                where: "account_id is not null"
      - name: customer_segment
        description: "Null for non-customer companies -- populated via join to dim_accounts."
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
              config:
                where: "customer_segment is not null"
      - name: territory
        description: >
          One of NA-East / NA-West / EMEA / APAC / LATAM -- a deterministic
          sub-division of region, resolving for every row (every
          market_universe company has exactly one territory row).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NA-East', 'NA-West', 'EMEA', 'APAC', 'LATAM']

  - name: dim_campaign
    description: >
      Grain: one row per campaign_id -- a channel program running over a
      defined [start_date, end_date] window. Singular name per the build
      spec's Phase 2 dimension list. The organic/paid/community channel
      taxonomy here DECOMPOSES the `inbound_marketing` value of
      dim_accounts.channel; it is not a replacement for that field and
      carries no self_serve or outbound_sdr volume, so the two columns must
      never be joined or unioned as if they shared a domain.
    columns:
      - name: campaign_id
        tests: [not_null, unique]
      - name: campaign_name
        tests: [not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid', 'community']
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: start_month
        description: Month of start_date, for period-level channel-mix rollups.
        tests: [not_null]
      - name: campaign_duration_days
        description: Inclusive window length, end_date - start_date + 1.
        tests: [not_null]
      - name: budget
        description: >
          USD budget for the program. An attribute of the campaign, not an
          additive per-event measure. A holdout cell's budget is withheld
          rather than re-labelled or re-spent elsewhere, so treated-vs-
          holdout spend comparisons are like-for-like.
        tests: [not_null]
      - name: is_holdout
        description: >
          Marks a genuinely suppressed control cell (treatment and budget
          both withheld), not merely a flag. Always false for organic --
          an SEO/content program cannot be switched off for a chosen cell,
          so a holdout there would have no operational meaning. Enforced by
          tests/assert_holdout_only_on_suppressible_channels.sql.
        tests: [not_null]

  - name: dim_experiment
    description: >
      Grain: one row per experiment_id. SHAPE: a dimension, not a fact --
      same call dim_campaign already makes for this project's other
      not-quite-typical "is this a dim or a fact" table. An experiment is a
      durable, descriptive registry entry (hypothesis, population/treatment/
      control definitions, target + guardrail metrics, a logged result once
      resolved), not an event stream -- fact_experiment_assignment.
      experiment_id is a foreign key into it, the same way
      fact_campaign_engagement_events.campaign_id is a foreign key into
      dim_campaign. Currently catalogs the one real, already-running
      randomized experiment in this data -- the paid/community marketing
      holdout program (dim_campaign.is_holdout) -- rather than a fabricated
      one.
    columns:
      - name: experiment_id
        description: Primary key.
        tests: [not_null, unique]
      - name: experiment_name
      - name: hypothesis
      - name: population_definition
      - name: treatment_definition
      - name: control_definition
      - name: assignment_mechanism
      - name: cell_quarters
        description: >
          Semicolon-separated list of quarter labels (e.g. "2023Q3; 2024Q2;
          2025Q1"), passed through as raw text -- splitting it into an
          array/table is left for a consumer that actually needs it, not
          invented here.
      - name: start_date
      - name: end_date
      - name: target_metric
      - name: guardrail_metrics
      - name: designed_effect_size
      - name: status
      - name: result_metric
      - name: result_value
      - name: result_se
      - name: result_z
      - name: result_significant
      - name: result_as_of_date
      - name: result_detail
      - name: result_source
