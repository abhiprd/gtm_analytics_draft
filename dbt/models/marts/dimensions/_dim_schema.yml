version: 2

models:
  - name: dim_date
    description: "Grain: one row per calendar day."
    columns:
      - name: date_day
        tests: [not_null, unique]

  - name: dim_accounts
    description: "Grain: one row per account_id (current state)."
    columns:
      - name: account_id
        tests: [not_null, unique]
      - name: company_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_market_universe')
                field: company_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['self_serve', 'inbound_marketing', 'outbound_sdr']
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ['Active', 'Churned']

  - name: dim_reps
    description: "Grain: one row per rep_id per capacity-period (quota/status change point)."
    columns:
      - name: rep_id
        tests: [not_null]
      - name: segment
        description: >
          Rep's segment focus -- SMB is self-serve/system-owned with no
          human reps, so only Commercial/Enterprise are valid here.
        tests:
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: rep_type
        tests:
          - accepted_values:
              arguments:
                values: ['ISR', 'AE', 'SE', 'AM-Commercial', 'AM-Enterprise']
      - name: rep_status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'departed']
    # Composite-key uniqueness for (rep_id, period_start_date) isn't a
    # single-column generic test -- dbt_utils isn't installed for this
    # project (kept dependency-free per the sources.yml design note), so
    # it's covered instead by the singular test
    # tests/assert_dim_reps_period_uniqueness.sql.

  - name: dim_market_universe
    description: "Grain: one row per company_id (prospect + customer universe)."
    columns:
      - name: company_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
              config:
                where: "account_id is not null"
      - name: customer_segment
        description: "Null for non-customer companies -- populated via join to dim_accounts."
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
              config:
                where: "customer_segment is not null"

  - name: dim_campaign
    description: >
      Grain: one row per campaign_id -- a channel program running over a
      defined [start_date, end_date] window. Singular name per the build
      spec's Phase 2 dimension list. The organic/paid/community channel
      taxonomy here DECOMPOSES the `inbound_marketing` value of
      dim_accounts.channel; it is not a replacement for that field and
      carries no self_serve or outbound_sdr volume, so the two columns must
      never be joined or unioned as if they shared a domain.
    columns:
      - name: campaign_id
        tests: [not_null, unique]
      - name: campaign_name
        tests: [not_null]
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid', 'community']
      - name: start_date
        tests: [not_null]
      - name: end_date
        tests: [not_null]
      - name: start_month
        description: Month of start_date, for period-level channel-mix rollups.
        tests: [not_null]
      - name: campaign_duration_days
        description: Inclusive window length, end_date - start_date + 1.
        tests: [not_null]
      - name: budget
        description: >
          USD budget for the program. An attribute of the campaign, not an
          additive per-event measure. A holdout cell's budget is withheld
          rather than re-labelled or re-spent elsewhere, so treated-vs-
          holdout spend comparisons are like-for-like.
        tests: [not_null]
      - name: is_holdout
        description: >
          Marks a genuinely suppressed control cell (treatment and budget
          both withheld), not merely a flag. Always false for organic --
          an SEO/content program cannot be switched off for a chosen cell,
          so a holdout there would have no operational meaning. Enforced by
          tests/assert_holdout_only_on_suppressible_channels.sql.
        tests: [not_null]
