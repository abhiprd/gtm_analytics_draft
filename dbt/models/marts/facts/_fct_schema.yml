version: 2

models:
  - name: fact_opportunities
    description: "Grain: one row per opportunity_id."
    columns:
      - name: opportunity_id
        tests: [not_null, unique]
      - name: account_id
        description: >
          Nullable: 1,191 Lost new-business opportunities (Commercial/ISR
          and Enterprise/AE) never had an account created -- an account
          only gets created on conversion. Won opportunities always have an
          account_id (see tests/assert_won_opportunities_have_account.sql).
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
              config:
                where: "account_id is not null"
      - name: rep_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: rep_id
              config:
                where: "rep_id is not null"
      - name: company_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_market_universe')
                field: company_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: opportunity_type
        tests:
          - accepted_values:
              arguments:
                values: ['new_business', 'renewal', 'expansion']
      - name: owner_role
        tests:
          - accepted_values:
              arguments:
                values: ['ISR', 'AE', 'AM', 'system']
      - name: loss_reason
        tests:
          - accepted_values:
              arguments:
                values: ['competitive', 'no_decision', 'price', 'other']
              config:
                where: "loss_reason is not null"

  - name: fact_opportunity_stage_history
    description: "Grain: one row per opportunity_id per stage-entered_date."
    columns:
      - name: opportunity_stage_history_id
        tests: [not_null, unique]
      - name: opportunity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_opportunities')
                field: opportunity_id
      - name: stage
        tests:
          - accepted_values:
              arguments:
                values: ['SAL', 'SQO', 'POC', 'Proposal/Negotiation', 'Negotiation', 'Open', 'Closed Won', 'Closed Lost']

  - name: fact_sales_activities
    description: >
      Grain: one row per rep-opportunity sales-engagement touch
      (activity_id) -- call, email, meeting, or demo. Commercial/Enterprise
      new-business opportunities only; SMB and expansion/renewal activity
      are out of scope by design. Every "booked" meeting row has exactly
      one later resolution row (held/no_show/rescheduled/cancelled) on the
      same opportunity_id. Deal-level columns (segment, is_won,
      loss_reason) live on fact_opportunities, not here -- join on
      opportunity_id.
    columns:
      - name: activity_id
        tests: [not_null, unique]
      - name: rep_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: rep_id
      - name: opportunity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_opportunities')
                field: opportunity_id
      - name: activity_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['call', 'email', 'meeting', 'demo']
      - name: outcome
        description: >
          Vocabulary is scoped per activity_type (call/email/meeting/demo
          each have their own set of valid outcomes); see
          assert_sales_activity_outcome_matches_activity_type for the
          per-type check this generic test can't express.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - connected
                  - voicemail
                  - no_answer
                  - gatekeeper
                  - replied
                  - opened_no_reply
                  - no_response
                  - bounced
                  - booked
                  - held
                  - no_show
                  - rescheduled
                  - cancelled
      - name: activity_timestamp
        tests: [not_null]
      - name: activity_date
        description: "cast(activity_timestamp as date) -- the incremental filter/dedupe key."
        tests: [not_null]
      - name: contact_ref
        description: >
          Synthetic per-opportunity participant-slot identifier (e.g.
          "OPP-0001234-C2") -- not a foreign key to a contacts table, since
          this project has none yet. Distinct contact_ref per opportunity
          measures multi-threading.
        tests: [not_null]
      - name: competitive_signal
        description: >
          Per-touch flag; correlates with but does not perfectly predict
          fact_opportunities.loss_reason = 'competitive'.
        tests: [not_null]
      - name: is_outbound_touch
        description: >
          True only on Enterprise call/email rows -- a rep-initiated
          prospecting touch into an already-open deal's buying committee.
          Not the acquisition-channel sense of outbound SDR.
        tests: [not_null]

  - name: fact_account_segment_history
    description: "Grain: one row per account_id per segment-effective_date."
    columns:
      - name: account_segment_history_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: trigger_reason
        tests:
          - accepted_values:
              arguments:
                values: ['initial_firmographic', 'initial_default', 'usage_threshold', 'firmographic_rescore']

  - name: fact_usage_monthly
    description: "Grain: one row per account_id per month."
    columns:
      - name: usage_monthly_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']

  - name: fact_committed_vs_utilized_monthly
    description: "Grain: one row per account_id per month."
    columns:
      - name: committed_vs_utilized_monthly_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']

  - name: fact_revenue_monthly
    description: "Grain: one row per account_id per month."
    columns:
      - name: revenue_monthly_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      # mrr >= 0 is covered by the singular test
      # tests/assert_no_negative_revenue.sql (QA-plan invariant).

  - name: fact_workflow_chain_events
    description: "Grain: one row per account_id per month."
    columns:
      - name: workflow_chain_event_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id

  - name: fact_subscriptions
    description: "Grain: one row per subscription_id."
    columns:
      - name: subscription_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: contract_type
        tests:
          - accepted_values:
              arguments:
                values: ['metered_month_to_month', 'annual', 'multi_year']
      - name: status
        tests:
          - accepted_values:
              arguments:
                values: ['active', 'churned', 'contracted', 'expanded', 'renewed']

  - name: fact_support_tickets
    description: "Grain: one row per ticket_id."
    columns:
      - name: ticket_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: severity
        tests:
          - accepted_values:
              arguments:
                values: ['low', 'medium', 'high', 'critical']

  - name: fact_am_activity
    description: "Grain: one row per activity_id."
    columns:
      - name: activity_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: rep_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_users')
                field: rep_id
      - name: segment
        description: "SMB is no-touch (no AM) -- never appears here."
        tests:
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: activity_type
        tests:
          - accepted_values:
              arguments:
                values: ['QBR', 'check_in']

  - name: fact_rep_monthly_cost
    description: >
      Grain: one row per rep_id per calendar month in which the rep was
      employed for at least one day. Static per-rep OTE / fully-loaded cost
      (dim_reps) accrued day-by-day from hire_date to the departure date, so
      a ramping rep costs money before producing -- the metric tree's "Rep
      fully-loaded cost, incl. ramp" (S&M cost) and the AM-comp input to "AM
      cost by segment". ramping_days / monthly_ramping_cost_usd isolate the
      six-month (two-quarter) ramp window after the hire date.
    columns:
      - name: rep_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_reps')
                field: rep_id
      - name: month
        tests: [not_null]
      - name: rep_type
        tests:
          - accepted_values:
              arguments:
                values: ['ISR', 'AE', 'SE', 'AM-Commercial', 'AM-Enterprise']
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: active_days
        description: "Days of the month the rep was employed (1 to days_in_month)."
        tests: [not_null]
      - name: monthly_fully_loaded_cost_usd
        description: "fully_loaded_annual_cost_usd / 12 x active_days / days_in_month."
        tests: [not_null]

  - name: fact_marketing_spend
    description: "Grain: one row per channel per month."
    columns:
      - name: marketing_spend_id
        tests: [not_null, unique]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ['inbound_marketing', 'outbound_sdr', 'self_serve']

  - name: fact_product_logins
    description: "Grain: one row per login_id."
    columns:
      - name: login_id
        tests: [not_null, unique]
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']

  - name: fact_model_performance_history
    description: >
      Grain: one row per (model_name, as_of_date, metric_name). Append-only
      Phase 4 model-eval log -- see docs/acme-corp-analytics-methods.md and
      the drift-monitor agent, which both call this "mart_model_performance_
      history" informally; it's fct_-named here per dbt-conventions since
      it's a log, not a cross-cutting business mart. Zero rows until the
      first Phase 4 artifact is built and backtested.
    columns:
      - name: model_performance_id
        tests: [not_null, unique]
      - name: model_name
        tests: [not_null]
      - name: as_of_date
        tests: [not_null]
      - name: metric_name
        tests: [not_null]

  - name: fact_playbook_triggers
    description: >
      Grain: one row per (rule_id, account_id, timestamp) automated-
      playbook-trigger firing. Operational log -- see docs/acme-corp-
      analytics-methods.md's "Automated playbook triggers" entry and
      analytics/playbook_triggers.py. Carries, per firing: the outcome
      resolved from data observed after it (or recorded manually / by a
      CRM), the owning rep resolved from real assignment data, and an SLA
      clock with a status computed as of var('analysis_as_of_date'). It is
      the task-list read: filter sla_status in (open_within_sla,
      breached) and outcome <> 'resolved'.
    columns:
      - name: playbook_trigger_id
        tests: [not_null, unique]
      - name: rule_id
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - ingestion_without_completion
                  - poc_pass_rate_below_threshold
                  - post_close_underutilization
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: timestamp
        tests: [not_null]
      - name: resulting_action
        description: >
          Deterministic 1:1 with rule_id -- analytics/playbook_triggers.py's
          RULES dict fixes exactly one resulting_action string per rule_id,
          never chosen independently, and every fired trigger carries one.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Escalate to CS for workflow-chain diagnostic outreach
                  - Escalate to Sales Engineering leadership for POC process review
                  - Trigger AM proactive onboarding check-in
      - name: outcome
        description: >
          Whether the condition the rule fired on was remedied, judged from
          data observed strictly after the trigger against the rule's
          OUTCOME_CRITERIA (PROPOSED). resolved = the criterion was met
          inside the rule's window; unresolved = it was not (including the
          account churning first); pending = the window had not elapsed as
          of outcome_evaluated_as_of, never guessed; not_evaluable = the
          window elapsed but the data cannot decide it. A manually / CRM-
          recorded outcome (outcome_source manual / crm) is never
          overwritten by the automated resolver.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [resolved, unresolved, pending, not_evaluable]
      - name: outcome_date
        description: >
          Date of the evidence that decided the outcome (the confirming
          recovery month, the churn date, or the window end). Null while
          pending.
      - name: outcome_metric_value
        description: >
          The metric value that decided the outcome (the recovered
          completion / utilization rate, or the forward POC pass rate). Null
          when no value decided it (pending, churned, no observations).
      - name: outcome_reason
        description: >
          Why the outcome is what it is, e.g. window_open,
          sustained_recovery_within_window, churned_before_recovery,
          no_sustained_recovery_in_window, forward_pass_rate_recovered.
      - name: outcome_window_end
        description: >
          End of the rule's observation window; a non-pending automated
          outcome always has outcome_window_end <= outcome_evaluated_as_of.
      - name: outcome_evaluated_as_of
        description: The as_of_date the automated resolver last evaluated this row at.
      - name: outcome_source
        description: automated (analytics/playbook_triggers.py's resolver), manual, or crm.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [automated, manual, crm]
      - name: owner_rep_id
        description: >
          The rep who owns the follow-up, resolved from real assignment data
          by the rule's OWNER_RULES basis: the account's AM of record (most
          recent fact_am_activity rep as of the SLA clock start, active in
          dim_reps then) for ingestion_without_completion and
          post_close_underutilization; the failed-POC opportunity's AE for
          poc_pass_rate_below_threshold. Null with owner_unresolved_reason
          when none is resolvable -- never fabricated.
        tests:
          - relationships:
              arguments:
                to: ref('dim_reps')
                field: rep_id
      - name: owner_role
        description: The owner's dim_reps.rep_type; null exactly when owner_rep_id is null.
        tests:
          - accepted_values:
              arguments:
                values: [AE, AM-Commercial, AM-Enterprise]
      - name: owner_unresolved_reason
        description: >
          Populated exactly when owner_rep_id is null. smb_no_touch_no_human_owner:
          SMB is no-touch by design and has no AM. no_am_activity_as_of_trigger:
          a non-SMB account with no AM activity yet at the SLA clock start.
          owner_departed_as_of_trigger: the AM of record had departed.
          no_matching_opportunity: no failed-POC opportunity with a rep on
          the trigger date.
        tests:
          - accepted_values:
              arguments:
                values:
                  - smb_no_touch_no_human_owner
                  - no_am_activity_as_of_trigger
                  - owner_departed_as_of_trigger
                  - no_matching_opportunity
                  - owner_not_in_dim_reps
      - name: account_territory
        description: >
          The account's territory (dim_accounts.territory) -- routing
          context on every row, not an owner: territory reps are ISR / AE
          new-business reps.
      - name: sla_hours
        description: Configured SLA length for the rule (SLA_CONFIG, PROPOSED).
        tests: [not_null]
      - name: sla_due_at
        description: >
          SLA clock start plus sla_hours. A month-grain trigger's clock
          starts the first of the following month (its figure is not
          knowable until the month ends); a day-grain trigger's clock starts
          on its own date.
        tests: [not_null]
      - name: closed_at
        description: >
          When the owner actioned the task, set only by a recorded closure
          (record_outcome); never inferred. Null on every backfilled row --
          the source has no task-action data, so every past-due row reads
          breached.
      - name: sla_status
        description: >
          Computed as of var('analysis_as_of_date'): closed_within_sla /
          closed_late when a closure is recorded by then, otherwise
          open_within_sla / breached by whether sla_due_at has passed.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [open_within_sla, breached, closed_within_sla, closed_late]
      - name: escalation_required
        description: True when the task is open and past its SLA (sla_status = breached).
        tests: [not_null]
      - name: escalation_to
        description: >
          The manager to escalate to. Null on every row: the source data
          carries no manager / reporting-line field for any rep.
      - name: escalation_reason
        description: >
          no_reporting_line_in_source while escalation_to cannot be resolved;
          a raw-data addition (a rep -> manager mapping) is what populates it.
        tests:
          - accepted_values:
              arguments:
                values: [no_reporting_line_in_source]

  - name: fact_forecast_submissions
    description: >
      Grain: one row per (opportunity_id, snapshot_date) -- one weekly
      Friday forecast call on one open Commercial/Enterprise opportunity.
      A point-in-time judgement, not a property of the deal; the same
      opportunity carries one row per Friday it was open. SMB never
      appears. Distinct from fact_opportunities.forecast_category, which
      is a single close-time field on the deal.
    columns:
      - name: forecast_submission_id
        description: >
          Surrogate key over the stated grain (opportunity_id,
          snapshot_date) -- its unique test is what enforces the QA plan's
          "no duplicate (opportunity_id, snapshot_date) pairs" invariant,
          dbt_utils not being installed for this project.
        tests: [not_null, unique]
      - name: opportunity_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_opportunities')
                field: opportunity_id
      - name: snapshot_date
        tests: [not_null]
      - name: rep_forecast_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Omitted', 'Pipeline', 'Best Case', 'Commit']
      - name: manager_forecast_category
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Omitted', 'Pipeline', 'Best Case', 'Commit']
      - name: rep_forecast_rank
        description: "Ordinal rank of rep_forecast_category: Omitted 0 -> Commit 3."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: manager_forecast_rank
        description: "Ordinal rank of manager_forecast_category: Omitted 0 -> Commit 3."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1, 2, 3]
                quote: false
      - name: rep_minus_manager_rank_gap
        description: >
          rep_forecast_rank minus manager_forecast_rank. Positive = rep
          more confident than manager (manager downgrade); negative =
          manager more confident than rep. Both directions occur, per the
          QA plan's Test E existence check.
        tests: [not_null]
      - name: is_manager_downgrade
        tests: [not_null]
      - name: is_manager_upgrade
        tests: [not_null]

  - name: fact_cro_forecast_adjustments
    description: >
      Grain: at most one row per (period, segment) -- one logged, reasoned
      CRO override of a segment-quarter's bottoms-up forecast roll-up.
      Sparse by design: an absent (period, segment) pair means no override
      was filed, not missing data, so this table must be left-joined, never
      inner-joined, to a full quarter/segment spine.
    columns:
      - name: cro_forecast_adjustment_id
        description: >
          Surrogate key over the stated grain (period, segment); its unique
          test enforces the at-most-one-row-per-segment-quarter invariant.
        tests: [not_null, unique]
      - name: period
        description: "Fiscal quarter label, 'YYYY-Qn'."
        tests: [not_null]
      - name: period_start_date
        tests: [not_null]
      - name: period_end_date
        tests: [not_null]
      - name: segment
        description: >
          Commercial/Enterprise only -- SMB files no bottoms-up forecast,
          so there is nothing for a CRO to override.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: adjustment_amount
        description: >
          Signed USD applied on top of the bottoms-up roll-up. Negative for
          coverage shortfall and slippage risk, positive for a sandbagging
          correction or named-account upside.
        tests: [not_null]
      - name: is_downward_adjustment
        tests: [not_null]
      - name: reason
        description: >
          Closed four-value set the generator defines. All four occur in
          the generated data, per the QA plan's Test E existence check.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - pipeline_coverage_shortfall
                  - rep_sandbagging_pattern
                  - late_stage_slippage_risk
                  - named_account_upside
      - name: timestamp
        tests: [not_null]

  - name: fact_leads
    description: >
      Grain: one row per lead_id. An accumulating-snapshot fact (created ->
      converted) with the conversion outcome as its measure, standing in the
      same relation to fact_campaign_engagement_events that
      fact_opportunities stands in to fact_opportunity_stage_history. The
      lead's firmographics are not here -- they live on dim_market_universe,
      reachable via company_id. The organic/paid/community channel taxonomy
      DECOMPOSES the `inbound_marketing` value of dim_accounts.channel and
      does not replace it; channel remains orthogonal to segment.
    columns:
      - name: lead_id
        tests: [not_null, unique]
      - name: account_id
        description: >
          Populated only on converting leads; NULL by design for the
          non-converting population, which is sized off a stated
          per-sub-channel lead-to-customer conversion rate rather than
          representing missing data. Converting leads are 1:1 with the
          inbound_marketing slice of dim_accounts in both directions --
          every converting lead resolves to a real inbound-acquired account,
          and every such account is explained by exactly one converting
          lead.
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
              config:
                where: "account_id is not null"
          - unique:
              config:
                where: "account_id is not null"
      - name: company_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_market_universe')
                field: company_id
      - name: channel
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid', 'community']
      - name: created_date
        tests: [not_null]
      - name: converted_date
        description: >
          NULL unless is_converted. Equal to the resolved account's
          signup_date, and strictly later than created_date -- a lead
          created the same day as the signup it explains would leave no
          funnel behind it to attribute.
      - name: is_converted
        tests: [not_null]
      - name: lead_score
        description: >
          Composite as of the lead's TERMINAL state, NOT point-in-time. It
          reads observed engagement depth, so it leaks the conversion
          outcome and must not be used as a feature to predict it. Exposed
          for channel-mix and lead-quality reporting only; point-in-time
          scoring belongs to lead_scoring_history.
        tests: [not_null]
      - name: days_to_conversion
        description: >
          Lead-to-signup gap in days; NULL for non-converting leads.
          Strictly positive where present.

  - name: fact_campaign_engagement_events
    description: >
      Grain: one row per event_id -- raw TOUCH grain, one row per touch,
      NEVER deduplicated to one row per lead or per campaign. This is the
      multi-touch-attribution event stream: deduplicating it would make
      first-touch, last-touch and linear attribution identical by
      construction. Point-in-time safety: no touch on a converting lead
      falls on or after that lead's converted_date, every touch falls inside
      its own campaign's window, and timestamps are strictly unique within a
      lead so first-touch/last-touch positions are unambiguous. touch_seq
      and first/last-touch flags are deliberately NOT materialized here --
      they are window functions an incremental model cannot maintain
      correctly, and they are attribution decisions rather than raw-stream
      facts.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: lead_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_leads')
                field: lead_id
      - name: campaign_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id
      - name: channel
        description: >
          The CAMPAIGN's sub-channel, which is not always the lead's own --
          cross-sub-channel touch paths are deliberate and load-bearing for
          attribution. Join to fact_leads for the lead's channel rather than
          assuming the two agree.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['organic', 'paid', 'community']
      - name: event_type
        description: >
          Closed per-sub-channel vocabulary -- every event's event_type
          belongs to its own channel's set, and every listed value actually
          occurs in the data.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - organic_search_visit
                  - blog_view
                  - docs_view
                  - content_download
                  - ad_click
                  - landing_page_view
                  - retargeting_click
                  - paid_asset_download
                  - event_registration
                  - event_attendance
                  - community_join
                  - community_post
      - name: event_timestamp
        tests: [not_null]
      - name: event_date
        description: Date part of event_timestamp; also the incremental filter key.
        tests: [not_null]

  - name: fact_lead_scoring_history
    description: >
      Grain: one row per score_id -- one point-in-time scoring event on one
      lead. A re-application of firmographics.py's compute_fit_score() to
      the leads.csv population over time (build spec's market_universe.
      icp_fit_score framing), not a new methodology, and distinct from
      fact_leads.lead_score, which is the lead's TERMINAL, outcome-aware
      composite. Every scoring event on a converting lead lands strictly
      before that lead's converted_date -- no outcome leakage, load-bearing
      for the model-validation/drift-detection artifact this table feeds.
    columns:
      - name: score_id
        tests: [not_null, unique]
      - name: lead_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_leads')
                field: lead_id
      - name: scored_at
        tests: [not_null]
      - name: model_version
        description: >
          lead_fit_v2_region_aware (from MODEL_CUTOVER_DATE, 2024-07-01) is
          compute_fit_score() exactly, region term included;
          lead_fit_v1_preregion is the identical employee-band/industry
          coefficients with no region term computed at all.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['lead_fit_v1_preregion', 'lead_fit_v2_region_aware']
      - name: predicted_segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: predicted_fit_score
        tests: [not_null]
      - name: employee_band_component
        tests: [not_null]
      - name: industry_component
        tests: [not_null]
      - name: region_component
        description: >
          NULL wherever model_version = 'lead_fit_v1_preregion' -- that
          model version never computed a region term at all. A real "not
          computed" null, not a coincidental zero.
      - name: noise_component
        tests: [not_null]

  - name: fact_experiment_assignment
    description: >
      Grain: one row per (experiment_id, lead_id) -- one lead's assignment
      to one experiment's arm. Currently 1:1 with lead_id/assignment_id
      since only one experiment exists in this data, but the grain is
      stated as the compound pair, not just lead_id, since a future second
      experiment could assign the same lead again. arm's assignment is not
      an independent random draw: it traces back to the real is_holdout
      flag of the lead's real first-touch campaign (dim_campaign.
      is_holdout), fixed at that first touch per the registry's
      intention-to-treat assignment_mechanism.
    columns:
      - name: assignment_id
        description: Primary key.
        tests: [not_null, unique]
      - name: experiment_id
        description: Foreign key to dim_experiment.experiment_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_experiment')
                field: experiment_id
      - name: lead_id
        description: Foreign key to fact_leads.lead_id.
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('fact_leads')
                field: lead_id
      - name: account_id
        description: >
          Soft/nullable reference into dim_accounts, populated only for
          converting leads -- mirrors fact_leads.account_id's nullability.
          A relationships test here should be scoped the same way
          fact_leads.account_id's is (`where: "account_id is not null"`),
          not left unqualified against the non-converting population's
          legitimate nulls.
        tests:
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
              config:
                where: "account_id is not null"
      - name: company_id
        description: Foreign key to dim_market_universe.company_id.
      - name: channel
        description: >
          organic / paid / community, same domain as dim_campaign.channel --
          but this table is scoped to the two holdout-eligible sub-channels
          only (config.HOLDOUT_CHANNELS), never organic.
        tests:
          - accepted_values:
              arguments:
                values: ['paid', 'community']
      - name: cell_quarter
        description: A single quarter label (e.g. "2023Q3").
      - name: first_touch_campaign_id
        description: Foreign key to dim_campaign.campaign_id.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_campaign')
                field: campaign_id
      - name: arm
        description: >
          'treatment' or 'control' -- traces back to the real is_holdout
          flag of the lead's real first-touch campaign, not an independent
          random draw.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['treatment', 'control']
      - name: assigned_date
