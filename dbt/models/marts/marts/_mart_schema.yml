version: 2

# None of these marts have a single surrogate-key column (dbt_utils isn't
# installed for this project, per the sources.yml design note), so each
# mart's composite grain -- stated in its own model header comment -- is
# covered instead by tests/assert_mart_grain_uniqueness.sql, the same
# pattern dim_schema.yml uses for dim_reps.

models:
  - name: mart_growth_bridge
    description: >
      Growth pillar: Starting + New logo − Contraction − Churn + Expansion
      (± segment migration, nets to zero), plus Activation (TTFA). Grain:
      one row per segment per month.
    columns:
      - name: segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: month
        tests: [not_null]

  - name: mart_durability
    description: >
      Durability pillar: NRR / GRR / Logo retention. Grain: one row per
      segment per month.
    columns:
      - name: segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: month
        tests: [not_null]

  - name: mart_segment_migration
    description: >
      One row per migration event (excludes the initial segment-history row
      per account). trigger_reason is always usage_threshold or
      firmographic_rescore here.
    columns:
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: from_segment
        tests:
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial']
      - name: to_segment
        tests:
          - accepted_values:
              arguments:
                values: ['Commercial', 'Enterprise']
      - name: trigger_reason
        tests:
          - accepted_values:
              arguments:
                values: ['usage_threshold', 'firmographic_rescore']

  - name: mart_efficiency
    description: >
      Efficiency pillar: Magic Number / Consumption Payback /
      Onboarding-CS Efficiency / AM Efficiency. Grain: one row per segment
      per month. magic_number_sm_cost, magic_number, am_cost, and
      am_efficiency are NULL for every row -- see model header comment for
      the raw-data gap (no rep-cost/comp data).
    columns:
      - name: segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']
      - name: month
        tests: [not_null]

  - name: mart_account_health
    description: >
      Account health score / churn-risk model input mart. Grain: one row
      per account_id per month, anchored on fact_usage_monthly. Bundles
      usage, support-ticket, login, and AM-activity signals plus a churn
      outcome label (is_eventually_churned / churn_month / is_censored) so
      analytics/health_score.py never has to read the underlying fact
      tables directly. is_eventually_churned is a training label, not a
      health-score input -- see model header comment.
    columns:
      - name: account_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_accounts')
                field: account_id
      - name: month
        tests: [not_null]
      - name: segment
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SMB', 'Commercial', 'Enterprise']

  - name: mart_gtm_plan
    description: >
      FP&A/RevOps plan (target) values for the metric tree's Layer-1 nodes.
      Grain: one row per (layer1_metric, month), blended/company-wide (no
      segment cut). Ten of the tree's eleven Layer-1 nodes carry a plan row;
      Activation is excluded by design -- see model header comment and
      generators/gtm_plan.py. Not yet compared to actuals; that comparison
      is a later, separate Phase 4 task.
    columns:
      - name: layer1_metric
        description: >
          One of the metric tree's Layer-1 node names. Closed 10-value set
          (Activation excluded -- see model description).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - new_logo_consumption_revenue
                  - expansion_consumption_revenue
                  - contraction_churned_revenue
                  - magic_number
                  - consumption_payback
                  - onboarding_cs_efficiency
                  - am_efficiency
                  - nrr
                  - grr
                  - logo_retention
      - name: month
        tests: [not_null]
      - name: pillar
        description: >
          Growth / Efficiency / Durability -- the metric tree pillar this
          Layer-1 node rolls up to.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Growth', 'Efficiency', 'Durability']
      - name: plan_value
        description: >
          The planned/target value for this metric in this month, in the
          unit stated in the model header comment. IMPORTANT: for nrr, grr,
          and logo_retention, this is a decimal ANNUAL-EQUIVALENT rate
          (1.15, not 115) per generators/gtm_plan.py's stated units --
          NOT directly comparable to mart_durability's nrr / grr /
          logo_retention_rate columns, which are monthly-grain. A consumer
          comparing this plan value to mart_durability's actuals must
          annualize (or use a trailing-twelve-month figure) first; this
          mart does not perform that reconciliation.
        tests: [not_null]

  - name: mart_tam_whitespace
    description: >
      Grain: one row per region x industry x employee_count_band.
      Penetration and whitespace, run off dim_market_universe.
    columns:
      - name: region
        tests: [not_null]
      - name: total_companies
        tests: [not_null]
