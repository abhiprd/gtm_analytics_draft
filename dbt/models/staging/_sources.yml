version: 2

# Source pattern: dbt-duckdb external tables, not seeds. These 16 CSVs are
# Phase 1 generator output (data/raw/*.csv) -- tens to hundreds of thousands
# of rows each, regenerated whenever the generator reruns. Seeds are meant
# for small, dbt-managed reference data checked into the project; this is
# neither small nor dbt-owned, so each source table is bound via
# `meta.external_location` to a `read_csv` call over the file in place.
# dbt-duckdb substitutes `{name}` with the dbt source table name by default;
# the one raw file whose name doesn't match the table name we want
# (fact_workflow_chain_events.csv) gets an explicit per-table override.
sources:
  - name: raw
    description: >
      Phase 1 raw source CSVs (CRM, marketing, product telemetry, billing,
      CS-ops) generated by generators/ and written to data/raw/*.csv.
      Read directly via DuckDB's read_csv over the file path -- no copy
      into the warehouse, no seeds.
    meta:
      external_location: "{{ var('raw_data_path') }}/{name}.csv"
    tables:
      - name: accounts
      - name: account_segment_history
      - name: users
      - name: quota_history
      - name: rep_status_history
      - name: market_universe
      - name: opportunities
      - name: opportunity_stage_history
      - name: usage_monthly
      - name: workflow_chain_events
        meta:
          external_location: "{{ var('raw_data_path') }}/fact_workflow_chain_events.csv"
      - name: subscriptions
      - name: mrr_by_account_month
      - name: committed_vs_utilized_monthly
      - name: support_tickets
      - name: am_activity
      - name: marketing_spend_by_channel_month

  - name: analytics
    description: >
      Phase 4 analytics-artifact output. Currently just the model-performance
      log (data/model_performance_history.csv), appended to by
      analytics/model_performance.py after every backtest/build-time check --
      version-controlled like Phase 1 raw data, not written straight into
      the (gitignored, rebuild-from-scratch) DuckDB file.
    tables:
      - name: model_performance_history
        meta:
          external_location: "{{ var('model_performance_path') }}"
