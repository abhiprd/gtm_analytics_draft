name: 'acme_gtm'
version: '1.0.0'
config-version: 2

profile: 'acme_gtm'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Absolute-relative path to the Phase 1 raw CSV directory. Overridable via
  # `dbt run --vars '{raw_data_path: /abs/path}'` for CI or other checkouts.
  raw_data_path: "../data/raw"
  # Phase 4 model-eval log, appended to by analytics/model_performance.py --
  # not Phase 1 generator output, so it's not under raw_data_path. Kept as a
  # version-controlled CSV (like the Phase 1 raw data) rather than a row
  # written straight into the DuckDB file, since data/acme_gtm.duckdb is
  # gitignored and gets rebuilt from scratch -- a table populated only via
  # direct DuckDB inserts would lose its whole history on the next clean
  # `dbt build`. See analytics-engineering-conventions's "where model-
  # performance history lives" entry.
  model_performance_path: "../data/model_performance_history.csv"
  # Phase 4 automated-playbook-triggers operational log, appended to by
  # analytics/playbook_triggers.py -- same treatment as
  # model_performance_path immediately above, for the same reason (a
  # version-controlled CSV, not a row written straight into the
  # gitignored, rebuilt-from-scratch data/acme_gtm.duckdb).
  playbook_triggers_path: "../data/playbook_triggers.csv"
  # Fixed "as of" date used for any open-ended interval math (e.g. days in
  # current segment, is account still active). The raw data horizon ends
  # 2025-12-31; using wall-clock today() would fabricate months of elapsed
  # time the generator never simulated.
  analysis_as_of_date: "2025-12-31"
  # Per-segment ACV band, USD. MUST equal generators/config.py ACV_RANGES
  # (the band every generated deal amount is clipped to); tests/
  # test_phase2_wave10_marts.py parses this block and fails on drift.
  # Consumed by mart_deal_funnel's share_won_at_band_floor / _cap.
  acv_bands:
    SMB: {floor: 0, cap: 15000}
    Commercial: {floor: 15000, cap: 75000}
    Enterprise: {floor: 75000, cap: 750000}
  # Window after a rep's hire_date inside which an opportunity created is
  # treated as owned by a ramping rep. MUST equal analytics/rep_productivity.py
  # _RAMP_FULL_DAYS (the "first 2 quarters" of build spec Section 4; also
  # generators/opportunities.py and analytics/capacity_planning.py); drift is
  # test-enforced by tests/test_phase2_wave10_marts.py.
  rep_ramp_window_days: 180
  # Workflow-chain full_chain_completion_rate below this value marks an
  # account-month as a partial chain. Equals the "ingestion_without_completion"
  # rule's completion_rate_threshold in analytics/playbook_triggers.py (0.70,
  # proposed, not yet confirmed); drift is test-enforced by
  # tests/test_phase2_wave10_marts.py. Consumed by mart_workflow_chain_health.
  workflow_chain_completion_threshold: 0.70
  # Flat gross margin on consumption revenue (metric tree: Consumption payback,
  # "flat ~80% gross margin assumed"; build spec). Read by mart_efficiency's
  # utilized-Action margin and, as GROSS_MARGIN, by analytics/ltv_by_segment.py
  # (the LTV node reuses the same margin); tests/test_phase4_ltv_by_segment.py
  # fails if the two differ or the SQL carries a margin literal again.
  consumption_gross_margin: 0.80

models:
  acme_gtm:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      dimensions:
        +materialized: table
        +schema: marts
      facts:
        +materialized: table
        +schema: marts
        fact_workflow_chain_events:
          +materialized: incremental
          +unique_key: workflow_chain_event_id
          +incremental_strategy: delete+insert
        fact_campaign_engagement_events:
          +materialized: incremental
          +unique_key: event_id
          +incremental_strategy: delete+insert
        fact_sales_activities:
          +materialized: incremental
          +unique_key: activity_id
          +incremental_strategy: delete+insert
      marts:
        +materialized: table
        +schema: marts

# The large, append-only event-grain facts -- incremental per the
# dbt-conventions skill's materialization rule:
#   - fact_workflow_chain_events (142,943 rows, growing with every new month
#     of usage)
#   - fact_campaign_engagement_events (135,965 raw marketing touches, growing
#     with every campaign month; never deduplicated, since multi-touch
#     attribution reads the whole undeduplicated path)
#   - fact_sales_activities (27,556 rep-opportunity touches, growing with
#     every new Commercial/Enterprise new-business engagement)
